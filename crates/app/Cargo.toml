[package]
name = "rust-terminal"
version = "0.1.0"
edition = "2024"

[dependencies]
rust-terminal-core = { path = "../core" }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry", "NSRunLoop", "NSDate", "NSThread", "NSObjCRuntime", "NSAttributedString", "NSRange", "NSArray", "NSNotification", "NSPort", "NSEnumerator", "NSLocale", "NSURL", "NSBundle", "NSUUID", "NSError"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWindow", "NSView", "NSResponder", "NSEvent", "NSTextInputClient", "NSMenu", "NSMenuItem", "NSPasteboard", "NSFont", "NSGraphics", "NSRunningApplication", "NSScreen", "NSColor", "NSText", "NSAlert", "NSCursor", "NSWorkspace", "objc2-quartz-core", "objc2-core-foundation"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAMetalLayer", "CADisplayLink", "CAMediaTiming", "objc2-metal", "objc2-core-foundation"] }
objc2-metal = { version = "0.3", features = ["MTLDevice", "MTLLibrary", "MTLRenderPipeline", "MTLBuffer", "MTLTexture", "MTLCommandQueue", "MTLCommandBuffer", "MTLRenderCommandEncoder", "MTLCommandEncoder", "MTLResource", "MTLPixelFormat", "MTLDrawable", "MTLTypes", "MTLArgument", "MTLAllocation", "MTLSampler", "MTLVertexDescriptor"] }
objc2-core-text = { version = "0.3", features = ["CTFont", "CTFontDescriptor", "CTFontTraits", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", features = ["CGContext", "CGBitmapContext", "CGColorSpace", "CGImage", "CGFont"] }
objc2-core-foundation = { version = "0.3", features = ["CFString", "CFCGTypes", "CFAttributedString", "CFCharacterSet"] }
block2 = "0.6"
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotificationRequest", "UNNotificationContent", "UNNotificationTrigger", "block2"] }
toml = "1"
